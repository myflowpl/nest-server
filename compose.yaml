services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nest}
      POSTGRES_DB: ${POSTGRES_DB:-nest}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 15

  # Adminer - przeglądarkowy podgląd bazy (odpowiednik phpMyAdmin): http://localhost:8080
  # System: PostgreSQL, Serwer: db, Użytkownik: nest, Hasło: nest, Baza: nest
  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db-data:
